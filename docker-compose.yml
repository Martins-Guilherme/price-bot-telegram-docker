services:
  price-bot:
    build:
      context: ../../vendaOnline
      dockerfile: ../Docker/sqlite-bot/Dockerfile
    container_name: price-bot
    volumes:
      - ./db:/database
    ports:
      - "3000:3000"
    env_file:
      - ../../vendaOnline/.env
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-price-bot
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

networks:
  price-bot:
    driver: bridge
